<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabriel's Machine</title> 
    <style>
        body {
    background-image: url("img/binario.png"); 
    
    background-size: cover; 
    
    background-repeat: no-repeat; 
    
    background-position: center center; 

    background-attachment: fixed; 
    } h1 {
    color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    } h3 {
    color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    } p {
    color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    } div {
    color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    } button {
    padding: 5px 20px 5px 20px; border-radius: 15px; font-size: 15px; 
    }
    </style>
</head>

<body>
    <center>
        
        <h1>Gabriel's Machine</h1>

        <h3>Digite um número decimal:</h3>
        <input id="demo1" type="text" placeholder="Ex: 42">
        <br><br>

        <button onclick="converter()">Converter</button>

        <h3>Resultados:</h3>
        <p>Octal:
        <div id="demo2"></div>
        </p>
        <p>Hexadecimal:
        <div id="demo3"></div>
        </p>
        <p>Binário:
        <div id="demo4"></div>
        </p>
    </center>

    <script>
        function converter() {
            var decimal = Number(demo1.value);

            demo2.innerHTML = decimal.toString(8);
            demo3.innerHTML = decimal.toString(16);
            demo4.innerHTML = decimal.toString(2);
        }
    </script>
</body>

</html>
